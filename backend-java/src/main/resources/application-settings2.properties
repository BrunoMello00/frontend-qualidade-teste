# Configurações específicas para settings2
server.port=8081
spring.application.name=Backend Qualidade Teste Settings2

# Configurações de banco alternativo
spring.datasource.url=jdbc:h2:mem:testdb2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password123

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (para desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.qualidade.teste=DEBUG
logging.level.org.springframework.web=DEBUG

# Configurações específicas da aplicação
app.environment=settings2
app.debug.enabled=true
app.features.enhanced-validation=true