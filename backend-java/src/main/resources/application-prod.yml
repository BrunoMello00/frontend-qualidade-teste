# ========================================
# CONFIGURAÇÕES PARA AMBIENTE DE PRODUÇÃO
# ========================================

spring:
  # Configurações do Azure SQL Database
  datasource:
    url: jdbc:sqlserver://${DATABASE_SERVER}:1433;database=${DATABASE_NAME};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
    # Pool de conexões otimizado para produção
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  
  # Hibernate para SQL Server
  jpa:
    hibernate:
      ddl-auto: validate  # NUNCA usar update/create em produção
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        '[format_sql]': false
  
  # H2 Console desabilitado
  h2:
    console:
      enabled: false
  
  # Flyway habilitado para migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # Azure Redis Cache
  data:
    redis:
      host: ${AZURE_REDIS_HOST}
      port: ${AZURE_REDIS_PORT}
      password: ${AZURE_REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 60000
  
  # Azure Key Vault habilitado
  cloud:
    azure:
      keyvault:
        secret:
          enabled: true
          endpoint: ${AZURE_KEYVAULT_URI}
          property-sources:
            - endpoint: ${AZURE_KEYVAULT_URI}
              name: keyvault
  
  # Configurações de email para produção
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Secret do Key Vault
jwt:
  secret: ${jwt-secret}

# CORS para produção
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Configurações específicas da aplicação
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Azure Identity
azure:
  client-id: ${AZURE_CLIENT_ID}
  client-secret: ${AZURE_CLIENT_SECRET}
  tenant-id: ${AZURE_TENANT_ID}

# Health checks habilitados
management:
  health:
    mail:
      enabled: true
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Logging para produção (menos verboso)
logging:
  level:
    '[com.tcc.estoque]': INFO
    '[org.springframework.security]': WARN
    '[org.springframework.web]': WARN
    '[org.hibernate.SQL]': WARN
    root: WARN
  
  # Configurações de arquivo de log para produção
  file:
    name: /var/log/estoque-vendas/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"